name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "app_dir=/var/www/pakexcise-live" >> "$GITHUB_OUTPUT"
            echo "pm2_name=pakexcise-live" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "url=https://pakexcise.com" >> "$GITHUB_OUTPUT"
            echo "needs_auth=false" >> "$GITHUB_OUTPUT"
          else
            echo "app_dir=/var/www/pakexcise-staging" >> "$GITHUB_OUTPUT"
            echo "pm2_name=pakexcise-staging" >> "$GITHUB_OUTPUT"
            echo "branch=staging" >> "$GITHUB_OUTPUT"
            echo "url=https://staging.pakexcise.com" >> "$GITHUB_OUTPUT"
            echo "needs_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy (with automatic rollback on failure)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            "source ~/.nvm/nvm.sh && cd ${{ steps.env.outputs.app_dir }} && git fetch origin && bash scripts/deploy-with-rollback.sh ${{ steps.env.outputs.app_dir }} ${{ steps.env.outputs.pm2_name }} ${{ steps.env.outputs.branch }}"

      - name: Verify public health endpoint
        run: |
          sleep 5
          if [[ "${{ steps.env.outputs.needs_auth }}" == "true" ]]; then
            curl -fsS -u "${{ secrets.STAGING_HEALTHCHECK_USER }}:${{ secrets.STAGING_HEALTHCHECK_PASS }}" "${{ steps.env.outputs.url }}/api/health"
          else
            curl -fsS "${{ steps.env.outputs.url }}/api/health"
          fi
